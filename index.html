<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Assignment - JavaScript Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>JavaScript Practice</h1>
    <p id="text">This is a sample text. You can change its style and size!</p>

    <div class="controls">
        <label for="fontSize">Font Size:</label>
        <input type="number" id="fontSize" placeholder="e.g. 20"> px
        <button onclick="changeFontSize()">Apply</button>

        <label for="fontStyle">Font Style:</label>
        <select id="fontStyle" onchange="changeFontStyle()">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Verdana">Verdana</option>
        </select>
    </div>

    <hr>

    <div class="image-section">
        <br>
        <input type="text" id="imageUrl" placeholder="Enter image URL">
        <button onclick="changeImage()">Change Image</button>
    </div>

    <hr>

    <div class="text-section">
        <input type="text" id="newText" placeholder="Enter new text">
        <button onclick="addText()">Add Text</button>
        <div id="textContainer"></div>
    </div>

    <hr>

    <div class="math-section">
        <h3>Basic Calculator</h3>
        <input type="number" id="num1" placeholder="Number 1">
        <input type="number" id="num2" placeholder="Number 2">
        <br>
        <button onclick="calculate('add')">+</button>
        <button onclick="calculate('subtract')">−</button>
        <button onclick="calculate('multiply')">×</button>
        <button onclick="calculate('divide')">÷</button>
        <p id="result">Result: </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
