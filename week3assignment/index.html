<!DOCTYPE html>
<html>
<head>
    <title>SkyCheck Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>


    <div id="hamburger">&#9776;</div>


    <div id="menu" class="menu">
        <a href="#">Home</a>
        <a href="#">Today</a>
        <a href="#">Weekly</a>
        <a href="#">Settings</a>
    </div>

 
    <div class="container">
        <h1 class="title">☁ SkyCheck ☀</h1>

        <p class="tagline">Your mood-friendly weather buddy!</p>

        <input type="text" id="cityName" placeholder="Type a city..." autocomplete="off">

        <button id="searchBtn">Check Weather</button>

        <div id="resultBox">
            <p id="result"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
